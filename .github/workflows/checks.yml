name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run licensing
      - run: npm test
      - name: Install packaging test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - run: python3 test/portmaster-package.py

  native:
    env:
      PMJS_SKIA65_COMPONENT_DIR: ${{ github.workspace }}/.cache/components/x64
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/host-${{ matrix.preset }}
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        preset: [dev, dev-skia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 clang-20 llvm-20 ccache \
            libnode-dev libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpng-dev libwebp-dev zlib1g-dev libjpeg-dev libfreetype-dev libharfbuzz-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev \
            xvfb xauth libegl-mesa0 libgl1-mesa-dri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Restore host Skia dependencies
        if: matrix.preset == 'dev-skia'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/skia65
            .cache/components/x64
          key: ${{ runner.os }}-${{ runner.arch }}-skia65-${{ hashFiles('tools/skia65/**', 'tools/llvm_tools.py', 'third_party/skia65-*', 'src/skia65/**', 'src/canvas/text_layout.*', 'src/canvas/canvas_pixels.hpp', 'src/canvas/unicode_default_ignorables.hpp') }}
      - name: Prepare host Skia component
        if: matrix.preset == 'dev-skia'
        run: python3 tools/skia65/build.py --arch x64 --output .cache/components/x64 --jobs 4 --reuse
      - name: Restore host compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-host-${{ matrix.preset }}-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-host-${{ matrix.preset }}-v1-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Configure native tests
        id: native-configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build native smoke suite
        if: github.event_name == 'pull_request' && matrix.preset == 'dev'
        run: cmake --build --preset ${{ matrix.preset }} --target pmjs-native-smoke --parallel 4
      - name: Build full native suite
        if: github.event_name != 'pull_request' || matrix.preset == 'dev-skia'
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Show compiler cache statistics
        run: ccache --show-stats
      - name: Run native smoke suite
        if: github.event_name == 'pull_request' && matrix.preset == 'dev'
        run: ctest --preset ${{ matrix.preset }} -L '^(smoke|build)$' --parallel 2 --no-tests=error --timeout 180 --output-junit "$GITHUB_WORKSPACE/build/${{ matrix.preset }}/native-tests.xml"
      - name: Run full native suite
        if: github.event_name != 'pull_request' || matrix.preset == 'dev-skia'
        env:
          PMJS_CI_PRESET: ${{ matrix.preset }}
          PMJS_CI_EVENT: ${{ github.event_name }}
        run: |
          labels='^(native|build)$'
          exclude=()
          if [[ "$PMJS_CI_PRESET" == dev-skia ]]; then
            labels='^native$'
            if [[ "$PMJS_CI_EVENT" != pull_request ]]; then
              exclude=(-LE '^backend-independent$')
            fi
          fi
          ctest --preset "$PMJS_CI_PRESET" -L "$labels" "${exclude[@]}" --parallel 2 --no-tests=error --timeout 600 --output-junit "$GITHUB_WORKSPACE/build/$PMJS_CI_PRESET/native-tests.xml"
      - name: Save native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-results-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/native-tests.xml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Verify relocated runtime graphics
        run: |
          cmake --install build/${{ matrix.preset }} --prefix "$PWD/dist/runtime-host" --component native-addon
          cmake --install build/${{ matrix.preset }} --prefix "$PWD/dist/runtime-host" --component runtime
          python3 tools/release.py manifest --stage dist/runtime-host --build build/${{ matrix.preset }} --source .
          python3 tools/release.py verify --stage dist/runtime-host \
            --report dist/verification-host.json --graphics --xvfb
      - name: Verify installed runtime integration
        run: LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy xvfb-run -a node test/release-workflow.cjs dist/runtime-host build/${{ matrix.preset }}
