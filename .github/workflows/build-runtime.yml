name: Build runtime
run-name: Build PMJS runtime (${{ github.ref_name }})

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Linux ARM64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      build-id: ${{ steps.identity.outputs.build-id }}
      title: ${{ steps.identity.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify build
        id: identity
        run: |
          build_date=$(date -u +%Y.%m.%d)
          build_time=$(date -u +%H%M%S)
          # SemVer ordering uses the timestamp first; run and attempt break same-second ties.
          build_id="v$build_date-$build_time.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          echo "PMJS_BUILD_ID=$build_id" >> "$GITHUB_ENV"
          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"
          title="PMJS-$build_date-$build_time"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check JavaScript and licenses
        run: |
          npm ci
          npm run lint
          npm run licensing
          npm test

      - name: Restore prepared ARM64 dependencies
        id: dependencies-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/linux-arm64
            .cache/skia65-arm64
            .cache/components/arm64
            .cache/effekseer
            .cache/lz4
            .cache/astcenc
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-arm64-v2-${{
            hashFiles('Dockerfile', 'tools/dependencies.py', 'tools/runtime_artifact.py', 'tools/llvm_tools.py',
            'tools/linux-arm64/*.py', 'tools/linux-arm64/*.json',
            'tools/skia65/*.py', 'tools/skia65/*.json',
            'tools/effekseer.lock.json', 'tools/lz4.lock.json', 'tools/astcenc.lock.json',
            'cmake/toolchains/**', 'third_party/skia65-*', 'src/skia65/**',
            'src/text_layout.*', 'src/canvas_pixels.hpp', 'src/unicode_default_ignorables.hpp') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-arm64-v2-

      - name: Restore legacy ARM64 dependencies
        if: steps.dependencies-cache.outputs.cache-hit == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/linux-arm64
            .cache/skia65-arm64
            .cache/components/arm64
            .cache/effekseer
          key: ${{ runner.os }}-arm64-v1-legacy
          restore-keys: |
            ${{ runner.os }}-arm64-v1-

      - name: Build and package runtime
        run: |
          source_archive="pmjs-ffmpeg-sources-${GITHUB_SHA:0:7}.tar.gz"
          docker build --target build-environment --tag pmjs-build-environment .
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            --env HOME=/tmp --env PMJS_BUILD_ID --env PMJS_PACKAGE_FORMAT=all \
            --env PMJS_SOURCES_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$PMJS_BUILD_ID/$source_archive" \
            pmjs-build-environment sh -ec './build.sh --target arm64 --jobs 2; python3 tools/release.py package'

      - name: Save build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmjs-linux-arm64
          path: |
            dist/pmjs-linux-arm64-*.tar.gz
            dist/pmjs-linux-arm64-*.tar.gz.*.json
            dist/pmjs-linux-arm64-*.squashfs
            dist/pmjs-linux-arm64-*.squashfs.release.json
            dist/pmjs-ffmpeg-sources-*.tar.gz
            dist/static-arm64.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pmjs-linux-arm64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ needs.build.outputs.build-id }}
          TITLE: ${{ needs.build.outputs.title }}
        run: |
          previous=$(git describe --tags --abbrev=0 \
            --match 'build-*' --match 'v[0-9]*' "$GITHUB_SHA" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')
            changelog="https://github.com/$GITHUB_REPOSITORY/compare/$previous...$BUILD_ID"
          else
            changes=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&per_page=100" \
              --jq '.[] | "- " + (.commit.message | split("\n")[0])')
            changelog="https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_SHA"
          fi
          {
            printf '%s\n' "$changes"
            printf '\n**Full Changelog**: %s\n' "$changelog"
          } > release-notes.md
          release_url=$(gh release create "$BUILD_ID" \
            "dist/pmjs-linux-arm64-${GITHUB_SHA:0:7}.tar.gz" \
            "dist/pmjs-linux-arm64-${GITHUB_SHA:0:7}.squashfs" \
            "dist/pmjs-ffmpeg-sources-${GITHUB_SHA:0:7}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md)
          printf 'Build download: %s\n\nRelease assets have no automatic expiration.\n' \
            "$release_url" >> "$GITHUB_STEP_SUMMARY"
